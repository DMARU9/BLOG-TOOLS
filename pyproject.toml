[project]
name = "blog-writer"
version = "0.1.0"
description = "Tools for automated blog writing and SEO optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytrends>=4.9.2",
    "markdownlint>=0.1.0",
    "httpx>=0.25.0"
]

[project.scripts]
blog-writer = "blog_writer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
